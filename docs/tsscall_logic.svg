<svg xmlns="http://www.w3.org/2000/svg" width="900" height="880" viewBox="0 0 900 880" role="img" aria-labelledby="ttl desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ttl">TSScall pipeline logic</title>
  <desc id="desc">TSScall reads forward and reverse 5-prime coverage bedGraphs, sets a read threshold, then runs two calling passes: an annotated pass producing obsTSS and an unannotated pass producing uTSS. Inside every window a per-window caller (global or bin_winner) picks the winner. Results are paired and clustered, then written to a BED and a detail file.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7C7B74" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="884" height="864" rx="16" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>

  <text x="40" y="52" font-size="27" font-weight="600" fill="#2C2C2A">TSScall</text>
  <text x="163" y="52" font-size="16" font-weight="400" fill="#5F5E5A">— transcription start site calling from nascent-RNA 5′ coverage</text>
  <text x="40" y="76" font-size="14" font-weight="400" fill="#888780">PRO-seq / Start-seq forward + reverse bedGraphs  →  annotated (obsTSS) and novel (uTSS) start sites</text>

  <!-- inputs -->
  <g font-size="13.5" font-weight="600" text-anchor="middle">
    <rect x="40"  y="98" width="188" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="134" y="123" fill="#0C447C">Forward bedGraph</text>
    <rect x="244" y="98" width="188" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="338" y="123" fill="#0C447C">Reverse bedGraph</text>
    <rect x="448" y="98" width="138" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="517" y="123" fill="#0C447C">chrom.sizes</text>
    <rect x="602" y="98" width="218" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="711" y="123" fill="#0C447C">annotation GTF (optional)</text>
  </g>
  <line x1="450" y1="138" x2="450" y2="164" stroke="#7C7B74" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- stage 1 -->
  <rect x="250" y="166" width="400" height="52" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="450" y="188" font-size="14.5" font-weight="600" text-anchor="middle" fill="#2C2C2A">1 · Combine &amp; sort coverage</text>
  <text x="450" y="207" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5F5E5A">forward + reverse → per-strand, per-nucleotide reads</text>
  <line x1="450" y1="218" x2="450" y2="242" stroke="#7C7B74" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- stage 2 -->
  <rect x="250" y="244" width="400" height="52" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="450" y="266" font-size="14.5" font-weight="600" text-anchor="middle" fill="#2C2C2A">2 · Set read threshold</text>
  <text x="450" y="285" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5F5E5A">--set_read_threshold, or FDR (Poisson model)</text>

  <!-- branch -->
  <line x1="450" y1="296" x2="450" y2="318" stroke="#7C7B74" stroke-width="1.6"/>
  <line x1="245" y1="318" x2="655" y2="318" stroke="#7C7B74" stroke-width="1.6"/>
  <line x1="245" y1="318" x2="245" y2="336" stroke="#7C7B74" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="655" y1="318" x2="655" y2="336" stroke="#7C7B74" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- left column: annotated -->
  <rect x="60" y="338" width="370" height="46" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="245" y="360" font-size="14.5" font-weight="600" text-anchor="middle" fill="#085041">Annotated pass → obsTSS</text>
  <text x="245" y="377" font-size="12" font-weight="400" text-anchor="middle" fill="#0F6E56">start sites at known gene starts</text>

  <g>
    <rect x="80" y="400" width="330" height="52" rx="9" fill="#EAF6F1" stroke="#1D9E75" stroke-width="1"/>
    <text x="245" y="421" font-size="13.5" font-weight="600" text-anchor="middle" fill="#085041">Build search windows</text>
    <text x="245" y="439" font-size="12" font-weight="400" text-anchor="middle" fill="#0F6E56">±window around each annotated TSS</text>
    <line x1="245" y1="452" x2="245" y2="466" stroke="#7C7B74" stroke-width="1.6" marker-end="url(#ah)"/>
    <rect x="80" y="468" width="330" height="52" rx="9" fill="#EAF6F1" stroke="#1D9E75" stroke-width="1"/>
    <text x="245" y="489" font-size="13.5" font-weight="600" text-anchor="middle" fill="#085041">Intersect coverage</text>
    <text x="245" y="507" font-size="12" font-weight="400" text-anchor="middle" fill="#0F6E56">assign reads to each window</text>
    <line x1="245" y1="520" x2="245" y2="534" stroke="#7C7B74" stroke-width="1.6" marker-end="url(#ah)"/>
    <rect x="80" y="536" width="330" height="52" rx="9" fill="#EAF6F1" stroke="#1D9E75" stroke-width="1"/>
    <text x="245" y="557" font-size="13.5" font-weight="600" text-anchor="middle" fill="#085041">Call one winner per window</text>
    <text x="245" y="575" font-size="12" font-weight="400" text-anchor="middle" fill="#0F6E56">→ obsTSS</text>
  </g>

  <!-- right column: unannotated -->
  <rect x="470" y="338" width="370" height="46" rx="9" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="655" y="360" font-size="14.5" font-weight="600" text-anchor="middle" fill="#712B13">Unannotated pass → uTSS</text>
  <text x="655" y="377" font-size="12" font-weight="400" text-anchor="middle" fill="#993C1D">novel / enhancer-class start sites</text>

  <g>
    <rect x="490" y="400" width="330" height="52" rx="9" fill="#FBF0EB" stroke="#D85A30" stroke-width="1"/>
    <text x="655" y="421" font-size="13.5" font-weight="600" text-anchor="middle" fill="#712B13">Mask known TSSs</text>
    <text x="655" y="439" font-size="12" font-weight="400" text-anchor="middle" fill="#993C1D">remove coverage near obsTSS / annotation</text>
    <line x1="655" y1="452" x2="655" y2="466" stroke="#7C7B74" stroke-width="1.6" marker-end="url(#ah)"/>
    <rect x="490" y="468" width="330" height="52" rx="9" fill="#FBF0EB" stroke="#D85A30" stroke-width="1"/>
    <text x="655" y="489" font-size="13.5" font-weight="600" text-anchor="middle" fill="#712B13">Seed windows from coverage</text>
    <text x="655" y="507" font-size="12" font-weight="400" text-anchor="middle" fill="#993C1D">±window around remaining peaks</text>
    <line x1="655" y1="520" x2="655" y2="534" stroke="#7C7B74" stroke-width="1.6" marker-end="url(#ah)"/>
    <rect x="490" y="536" width="330" height="52" rx="9" fill="#FBF0EB" stroke="#D85A30" stroke-width="1"/>
    <text x="655" y="557" font-size="13.5" font-weight="600" text-anchor="middle" fill="#712B13">Call winners per window</text>
    <text x="655" y="575" font-size="12" font-weight="400" text-anchor="middle" fill="#993C1D">→ uTSS (may be several per window)</text>
  </g>

  <!-- caller banner -->
  <line x1="245" y1="588" x2="245" y2="606" stroke="#7C7B74" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="655" y1="588" x2="655" y2="606" stroke="#7C7B74" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="60" y="608" width="780" height="60" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="450" y="631" font-size="14" font-weight="600" text-anchor="middle" fill="#633806">Per-window caller (used inside every window, both passes)</text>
  <text x="450" y="652" font-size="12.5" font-weight="400" text-anchor="middle" fill="#854F0B">global — single highest position    ·    bin_winner — diffuse sliding-window sum (default)</text>
  <line x1="450" y1="668" x2="450" y2="694" stroke="#7C7B74" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- merge -->
  <rect x="300" y="696" width="300" height="52" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="450" y="718" font-size="14.5" font-weight="600" text-anchor="middle" fill="#2C2C2A">Pair bidirectional TSSs</text>
  <text x="450" y="737" font-size="12.5" font-weight="400" text-anchor="middle" fill="#5F5E5A">divergent pairing · clustering</text>

  <!-- outputs -->
  <line x1="450" y1="748" x2="450" y2="765" stroke="#7C7B74" stroke-width="1.6"/>
  <line x1="350" y1="765" x2="560" y2="765" stroke="#7C7B74" stroke-width="1.6"/>
  <line x1="350" y1="765" x2="350" y2="781" stroke="#7C7B74" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="560" y1="765" x2="560" y2="781" stroke="#7C7B74" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="250" y="783" width="200" height="44" rx="9" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="350" y="810" font-size="13.5" font-weight="600" text-anchor="middle" fill="#27500A">BED — obsTSS + uTSS</text>
  <rect x="470" y="783" width="180" height="44" rx="9" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="560" y="810" font-size="13.5" font-weight="600" text-anchor="middle" fill="#27500A">detail file</text>

  <text x="450" y="852" font-size="11.5" font-weight="400" text-anchor="middle" fill="#888780">obsTSS = TSS at an annotated start   ·   uTSS = novel/unannotated start   ·   one BED + one detail file per run</text>
</svg>
